services:
  linkstack:
    image: ghcr.io/homelessavatar/linkstack-caddy:latest
    container_name: linkstack
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    environment:
      - TZ=Europe/Istanbul
      - PHP_MEMORY_LIMIT=128M
      - UPLOAD_MAX_FILESIZE=8M
    volumes:
      - linkstack_data:/htdocs

volumes:
  linkstack_data:
